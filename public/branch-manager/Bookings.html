<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookings - Branch Manager</title>
<link rel="icon" href="data:,">
<script src="/_shared/adrial-shell.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef;--panel:#fff;--panel2:#faf9f6;--line:#e2dfd6;--line2:#efede6;--text:#1f2421;--muted:#6b716c;
  --accent:#0f6b5c;--accent-ink:#fff;--accent-soft:#e2f1ed;--bad:#c23a2b;--warn:#a96a0b;--good:#2a8a4a;
  --closed:#ecebe6;--closed-line:#dedbd1;--break:rgba(0,0,0,.05);--focus:#1a73e8;--shadow:0 8px 30px rgba(0,0,0,.18);
  color-scheme:light;
}
html[data-adrial-mode="dark"]{
  --bg:#111412;--panel:#1a1d1b;--panel2:#1f2321;--line:#2e3431;--line2:#262b28;--text:#eceee9;--muted:#9aa29c;
  --accent:#4cc3a8;--accent-ink:#06201a;--accent-soft:#1c3530;--bad:#f07766;--warn:#e0a24a;--good:#59cc82;
  --closed:#171a18;--closed-line:#272c29;--break:rgba(255,255,255,.05);--focus:#7ab0ff;--shadow:0 8px 30px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.45 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;padding-bottom:64px}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1700px;margin:0 auto;padding:0 16px}
.crumb{padding:16px 0 4px;font-size:13px;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--text);text-decoration:underline}
h1{margin:0 0 12px;font-size:24px;font-weight:600;letter-spacing:-.02em}
.tb{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:10px}
.tb .sp{flex:1}
.ctl{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 10px;min-height:34px}
select.ctl{padding-right:6px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:6px 13px;min-height:34px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ico{padding:6px 10px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:7px;color:var(--muted);font-weight:500;min-height:26px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.navg{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.range{font-weight:600;min-width:170px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:4px 0 10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.note{padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel2)}
.note b{color:var(--text)}
.hintline{color:var(--muted);font-size:12.5px;margin:10px 2px}
kbd{font:500 11.5px 'Geist Mono',ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}

/* calendar grid */
.cal{overflow:auto;max-height:calc(100vh - 250px);min-height:360px;position:relative}
.cal-head{display:flex;position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--line);width:max-content;min-width:100%}
.cal-body{display:flex;width:max-content;min-width:100%}
.gut{width:52px;flex:none;position:sticky;left:0;z-index:3;background:var(--panel);border-right:1px solid var(--line)}
.cal-head .gut{z-index:5}
.hr{position:absolute;left:0;right:6px;text-align:right;font-size:11px;color:var(--muted);transform:translateY(-7px)}
.gcol{position:relative}
.dayh{border-left:1px solid var(--line);flex:none}
.dayh .dt{padding:6px 6px 2px;font-weight:600;font-size:13px;text-align:center}
.dayh .dt small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.dayh.today .dt{color:var(--accent)}
.dayh .rs{display:flex}
.dayh .rs span{flex:1;text-align:center;font-size:11px;color:var(--muted);padding:2px 0 4px;border-top:1px solid var(--line2)}
.dayc{display:flex;flex:none;border-left:1px solid var(--line)}
.room{position:relative;flex:1;border-left:1px solid var(--line2);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--line2) calc(var(--hour) - 1px),var(--line2) var(--hour))}
.room:first-child{border-left:0}
.room.open{cursor:copy}
.shade{position:absolute;left:0;right:0;background:var(--closed);pointer-events:none;background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--closed-line) 6px 7px)}
.shade.brk{background:var(--break);background-image:none}
.shade .lb{position:sticky;top:44px;display:block;padding:6px 4px;font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--bad);z-index:2;pointer-events:none}
.bk{position:absolute;left:2px;right:2px;border:0;border-left:3px solid var(--bar);border-radius:6px;padding:2px 5px;text-align:left;overflow:hidden;font-size:11.5px;line-height:1.25;z-index:1;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.bk:hover{box-shadow:0 0 0 2px var(--bar);z-index:2}
.bk b{font-weight:600;font-size:11px;display:block;white-space:nowrap}
.bk .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.bk.one{display:flex;gap:5px;align-items:baseline;white-space:nowrap}
.bk.one b{display:inline}
.bk.cx{opacity:.55;background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(0,0,0,.08) 5px 6px)}
.bk.cx .s{text-decoration:line-through}
.bk .flag{position:absolute;right:3px;top:2px;font-size:10px;font-weight:600}
.bk.ns{outline:2px dashed var(--bad);outline-offset:-2px}

/* agenda */
.ag-search{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ag-search input{flex:1;min-width:0}
.hgroup h3{margin:0;padding:8px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:600;position:sticky;top:0}
.ag{display:grid;grid-template-columns:96px 42px minmax(0,1.2fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:9px 14px}
.ag:hover{background:var(--panel2)}
.ag .t{font-variant-numeric:tabular-nums;font-weight:500}
.ag .rm{font:500 11.5px 'Geist Mono',ui-monospace,monospace;color:var(--muted)}
.ag .cu small{display:block;color:var(--muted)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.st{background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip.st.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.chip.st.me{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

/* shift (month) */
.shift{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.shift .dh{padding:6px 8px;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);background:var(--panel2)}
.cell{min-height:132px;border:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;background:transparent;font-size:12px;min-width:0}
.cell:hover{background:var(--panel2)}
.cell.out{opacity:.45}
.cell.closed{background:var(--closed);background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--closed-line) 6px 7px)}
.cell .dn{font-weight:600;font-size:13px;display:flex;justify-content:space-between}
.cell.today .dn span:first-child{color:var(--accent)}
.cell .hl{color:var(--muted);font-size:11.5px;margin:2px 0 4px}
.cell .ut{display:grid;grid-template-columns:22px 1fr 32px;gap:5px;align-items:center;margin-top:3px;font-size:11px}
.cell .ut .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.cell .ut .bar i{display:block;height:100%;background:var(--accent)}
.cell .hol{color:var(--bad);font-weight:500;font-size:11.5px}

/* overlay layer */
#layer{position:fixed;inset:0;z-index:50;pointer-events:none}
#layer>*{pointer-events:auto}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35)}
.scrim.clear{background:transparent}
.pop{position:fixed;width:300px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.pop h3{margin:0 0 2px;font-size:14px}
.pop p{margin:0 0 8px;color:var(--muted);font-size:12.5px}
.pop .acts{display:flex;flex-wrap:wrap;gap:6px}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.dlg.sm{width:min(420px,calc(100vw - 24px))}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(460px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow:auto;padding:18px}
.dlg h2,.drawer h2{margin:0 0 4px;font-size:18px;font-weight:600}
.sub{color:var(--muted);margin:0 0 12px;font-size:13px}
.x{position:absolute;right:10px;top:10px;border:0;background:transparent;font-size:20px;line-height:1;padding:4px 8px;color:var(--muted)}
.f{display:block;margin:10px 0 0}
.f>span{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 10px;min-height:34px}
.f textarea{min-height:64px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0 0}
.chk input,.rooms input,.f input[type=checkbox]{width:auto;min-height:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.err{margin-top:10px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 12px}
.tabs button{border:0;background:transparent;padding:6px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.steps{display:flex;gap:6px;margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.steps b{color:var(--text)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.slots button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 10px;font-variant-numeric:tabular-nums;min-height:30px}
.slots button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rooms{display:flex;flex-wrap:wrap;gap:10px}
.rooms label{display:flex;gap:6px;align-items:center}
.res{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.res button{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px}
.res button:hover{border-color:var(--accent)}
.res small{color:var(--muted)}
.visits{list-style:none;margin:6px 0 0;padding:0;max-height:280px;overflow:auto}
.visits li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line2);padding:6px 0}
.visits button{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--text);color:var(--bg);border-radius:10px;padding:9px 16px;z-index:60;font-weight:500;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ag{grid-template-columns:84px 36px minmax(0,1fr) auto}
  .ag .sv{display:none}
  .cell{min-height:96px}
  .cell .ut{display:none}
}
@media(max-width:600px){
  h1{font-size:20px}
  .fr,.fr3{grid-template-columns:1fr}
  .navg{width:100%}
  .navg .range{min-width:0;flex:1 1 100%;order:5;text-align:left}
  .tb>.sp{display:none}
  .ag{grid-template-columns:104px 32px minmax(0,1fr)}
  .ag>span:last-child{grid-column:1/-1}
  .cal{max-height:calc(100vh - 200px)}
  .cell .hl{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="crumb" aria-label="Breadcrumb"><a href="Main.dc.html">Branch Manager</a> &rsaquo; <span aria-current="page">Bookings</span></nav>
  <h1>Bookings</h1>

  <div class="tb" role="toolbar" aria-label="Branch, view and date">
    <label class="sr" for="branch">Branch</label>
    <select id="branch" class="ctl"></select>
    <div class="seg" role="group" aria-label="View" id="views">
      <button type="button" data-view="week" aria-pressed="false">Week</button>
      <button type="button" data-view="day" aria-pressed="false">Day</button>
      <button type="button" data-view="agenda" aria-pressed="false">Agenda</button>
      <button type="button" data-view="shift" aria-pressed="false">Shift plan</button>
    </div>
    <span class="sp"></span>
    <div class="navg">
    <button type="button" class="btn ico" id="prev" aria-label="Previous" title="Previous (Alt+Left)">&lsaquo;</button>
    <button type="button" class="btn" id="today" title="Today (T)">Today</button>
    <button type="button" class="btn ico" id="next" aria-label="Next" title="Next (Alt+Right)">&rsaquo;</button>
    <span class="range" id="range" aria-live="polite"></span>
    <label class="sr" for="date">Go to date</label>
    <input type="date" id="date" class="ctl">
    </div>
  </div>
  <div class="tb" role="toolbar" aria-label="Filters and actions">
    <label class="sr" for="svc">Service filter</label>
    <select id="svc" class="ctl"></select>
    <span class="sp"></span>
    <button type="button" class="btn" id="export">Export CSV</button>
    <button type="button" class="btn pri" id="new" title="New booking (N)">New booking</button>
  </div>

  <div class="stats" id="stats" aria-label="Summary for the visible range"></div>
  <div class="panel" id="panel"></div>
  <p class="hintline">Keys: <kbd>T</kbd> today, <kbd>N</kbd> new booking, <kbd>Alt</kbd>+<kbd>&larr;</kbd>/<kbd>&rarr;</kbd> previous/next, <kbd>1</kbd>-<kbd>4</kbd> views, <kbd>Esc</kbd> close. Sample data: changes stay in this browser and nothing is sent to TIMIFY.</p>
</div>
<div id="layer" aria-live="off"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ================= constants and helpers ================= */
  var LS_KEY = 'bm-bookings-v1';
  var GRID_START = 8 * 60, GRID_END = 19 * 60, PX = 1.9;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function validDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || '') && ymd(parse(s)) === s; }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function diffDays(a, b) { return Math.round((parse(a) - parse(b)) / 864e5); }
  function dow(s) { return (parse(s).getDay() + 6) % 7; }
  function mondayOf(s) { return addDays(s, -dow(s)); }
  function hm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function toMin(t) { var p = String(t || '').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function monthShort(m) { return MONTHS[m].slice(0, 3); }
  function longDate(s) { var d = parse(s); return DAYS[dow(s)] + ' ' + d.getDate() + ' ' + monthShort(d.getMonth()) + ' ' + d.getFullYear(); }
  function isoWeek(s) {
    var d = parse(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    var w1 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  var NOW = new Date();
  var TODAY = ymd(NOW);
  function nowMin() { var n = new Date(); return n.getHours() * 60 + n.getMinutes(); }
  function isPast(date, start) { return date < TODAY || (date === TODAY && start < nowMin()); }

  /* ================= branches, services ================= */
  function R(n, showroom) { var a = []; for (var i = 1; i <= n; i++) a.push({ code: 'E' + i, showroom: !!(showroom && i === n) }); return a; }
  var BRANCHES = [
    { id: 'osijek', name: 'Osijek', country: 'HR', rooms: R(2) },
    { id: 'rijeka', name: 'Rijeka', country: 'HR', rooms: R(2) },
    { id: 'split', name: 'Split', country: 'HR', rooms: R(3, true) },
    { id: 'zadar', name: 'Zadar', country: 'HR', rooms: R(2) },
    { id: 'zagreb', name: 'Zagreb', country: 'HR', rooms: R(3, true) },
    { id: 'komenda', name: 'Komenda', country: 'SI', rooms: R(2) },
    { id: 'koper', name: 'Koper', country: 'SI', rooms: R(2) },
    { id: 'maribor', name: 'Maribor', country: 'SI', rooms: R(3, true) },
    { id: 'novo-mesto', name: 'Novo Mesto', country: 'SI', rooms: R(2) }
  ];
  var BR = {}; BRANCHES.forEach(function (b) { BR[b.id] = b; });

  var SERVICES = [
    { id: 'ex20', name: 'Eye exam 20 min', dur: 20, w: 20, bg: '#dbeafe', ink: '#1e3a8a' },
    { id: 'ex30', name: 'Eye exam 30 min', dur: 30, w: 18, bg: '#e0e7ff', ink: '#3730a3' },
    { id: 'ex60', name: 'Eye exam 60 min', dur: 60, w: 7, bg: '#ede9fe', ink: '#5b21b6' },
    { id: 'sight', name: 'Sight measurement', dur: 20, w: 16, bg: '#cffafe', ink: '#155e75' },
    { id: 'clfit', name: 'Contact lens fitting', dur: 40, w: 8, bg: '#dcfce7', ink: '#166534' },

      if (f === 'service') { w.service = t.value; w.dur = SV[t.value].dur; pruneSel(); draw(); return; }
      if (f === 'dur') { w.dur = +t.value; pruneSel(); return; }
      if (f === 'date') { if (validDate(t.value)) { w.date = t.value; pruneSel(); if (w.step === 2) draw(); } return; }
      w[f] = t.value;
    }
    function onClick(e) {
      var t = e.target;
      var slot = t.closest('[data-slot]');
      if (slot) {
        var k = slot.getAttribute('data-slot');
        if (w.sel[k]) { delete w.sel[k]; slot.setAttribute('aria-pressed', 'false'); }
        else { var p = k.split('|'); w.sel[k] = { room: p[0], start: +p[1] }; slot.setAttribute('aria-pressed', 'true'); }
        $('#selcount', d).textContent = Object.keys(w.sel).length + ' selected';
        return;
      }
      var pk = t.closest('[data-pick]');
      if (pk) { var r = $('#cres', d)._res[+pk.getAttribute('data-pick')]; w.name = r.name; w.email = r.email; w.phone = r.phone; w.picked = r; draw(); return; }
      if (t.closest('[data-unpick]')) { w.picked = null; draw(); return; }
      if (t.closest('[data-back]')) { w.step--; draw(); return; }
      if (t.closest('[data-next]')) {
        if (w.step === 1) {
          var dd = $('[data-f="date"]', d);
          if (dd && validDate(dd.value)) w.date = dd.value;
          if (!w.rooms.length) return err('Tick at least one room.');
          if (!validDate(w.date)) return err('Choose a valid date.');
          if (w.date < TODAY) return err('That date is in the past.');
          pruneSel();
        } else if (w.step === 2) {
          if (!Object.keys(w.sel).length) return err('Select at least one free slot.');
        }
        w.step++; draw(); return;
      }
      if (t.closest('[data-save]')) save();
    }
    function save() {
      var name = w.name.trim(), email = w.email.trim();
      if (!name) return err('Customer name is required.');
      if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err('Email address looks invalid.');
      var hh = hours(w.date, br.country), keys = Object.keys(w.sel), bad = [];
      keys.forEach(function (k) {
        var s = w.sel[k];
        if (!inHours(hh, s.start, s.start + w.dur) || isPast(w.date, s.start) || !roomFree(br.id, s.room, w.date, s.start, s.start + w.dur)) bad.push(k);
      });
      if (bad.length) {
        bad.forEach(function (k) { delete w.sel[k]; });
        w.step = 2; draw();
        err('Some slots were just taken or are no longer valid and were removed. Pick again.');
        return;
      }
      keys.forEach(function (k) {
        var s = w.sel[k];
        putBooking({ id: newId(), branchId: br.id, date: w.date, room: s.room, start: s.start, dur: w.dur, service: w.service, title: w.service === 'custom' ? w.title.trim() : '',
          name: name, email: email, phone: w.phone.trim(), note: w.note.trim(), status: 'booked', noShow: false, createdBy: 'You (prototype)', generated: false });
      });
      closeLayer();
      state.date = w.date; if (state.view === 'shift') state.view = 'week';
      render();
      toast(keys.length + (keys.length === 1 ? ' booking' : ' bookings') + ' saved in this browser.' + (w.notify ? ' Customer notification simulated.' : '') + ' Nothing was sent to TIMIFY.');
    }
    draw();
  }

  /* ================= CSV export ================= */
  function csvCell(v, phone) {
    var s = String(v == null ? '' : v);
    if (/^[=@\t\r]/.test(s) || (/^[+-]/.test(s) && !(phone && /^\+\d[\d ]+$/.test(s)))) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCsv() {
    var rows = [['date', 'start', 'end', 'room', 'service', 'customer', 'email', 'phone', 'status', 'created_by', 'note']];
    rangeBookings().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : sortB(a, b); }).forEach(function (b) {
      rows.push([b.date, hm(b.start), hm(b.start + b.dur), b.room, svcName(b), b.name, b.email, b.phone, b.status === 'cancelled' ? 'cancelled' : b.noShow ? 'no-show' : 'booked', b.createdBy, b.note]);
    });
    var csv = '﻿' + rows.map(function (r, i) { return r.map(function (c, j) { return i ? csvCell(c, j === 7) : c; }).join(','); }).join('\r\n');
    var days = rangeDays(), blob = new Blob([csv], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bookings-' + state.branch + '-' + days[0] + (days.length > 1 ? '_' + days[days.length - 1] : '') + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast('Exported ' + (rows.length - 1) + ' bookings.');
  }

  /* ================= navigation ================= */
  function shift(dir) {
    if (state.view === 'week') state.date = addDays(state.date, 7 * dir);
    else if (state.view === 'shift') { var d = parse(state.date); state.date = ymd(new Date(d.getFullYear(), d.getMonth() + dir, 1)); }
    else state.date = addDays(state.date, dir);
    render();
  }
  function setView(v) { state.view = v; render(); }

  /* ================= wiring ================= */
  $('#branch').innerHTML = BRANCHES.map(function (b) { return '<option value="' + b.id + '">' + esc(b.name) + ' (' + b.country + ')</option>'; }).join('');
  $('#svc').innerHTML = '<option value="">All services</option>' + SERVICES.concat([CUSTOM]).map(function (s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('');
  $('#branch').addEventListener('change', function (e) { state.branch = e.target.value; render(); });
  $('#svc').addEventListener('change', function (e) { state.svc = e.target.value; render(); });
  $('#views').addEventListener('click', function (e) { var b = e.target.closest('[data-view]'); if (b) setView(b.getAttribute('data-view')); });
  $('#prev').addEventListener('click', function () { shift(-1); });
  $('#next').addEventListener('click', function () { shift(1); });
  $('#today').addEventListener('click', function () { state.date = TODAY; render(); });
  $('#date').addEventListener('change', function (e) { if (validDate(e.target.value)) { state.date = e.target.value; render(); } });
  $('#new').addEventListener('click', function () { newBooking(); });
  $('#export').addEventListener('click', exportCsv);

  $('#panel').addEventListener('input', function (e) {
    if (e.target.id === 'agq') {
      state.q = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var i = $('#agq'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) {} }
    }
  });
  $('#panel').addEventListener('click', function (e) {
    var bk = e.target.closest('[data-id]');
    if (bk) { var b = findBooking(bk.getAttribute('data-id')); if (b) quickActions(b, bk); return; }
    var cell = e.target.closest('[data-day]');
    if (cell) { state.date = cell.getAttribute('data-day'); state.view = 'day'; render(); return; }
    var room = e.target.closest('.room.open');
    if (room) {
      var r = room.getBoundingClientRect(), y = e.clientY - r.top, date = room.getAttribute('data-date'), rc = room.getAttribute('data-room');
      var start = GRID_START + Math.floor(y / PX / 10) * 10, h = hours(date, branch().country);
      if (!inHours(h, start, start + 10)) return toast('The branch is not open at that time.');
      if (isPast(date, start)) return toast('That time is in the past.');
      if (!roomFree(state.branch, rc, date, start, start + 10)) return toast('Room ' + rc + ' is already booked then.');
      newBooking({ date: date, room: rc, start: start });
    }
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target, tag = t && t.tagName;
    if (e.key === 'Escape') { if (layer.firstChild) { e.preventDefault(); closeLayer(); } return; }
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    if (layer.firstChild) return;
    if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); shift(e.key === 'ArrowLeft' ? -1 : 1); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === 't') { state.date = TODAY; render(); }
    else if (k === 'n') { e.preventDefault(); newBooking(); }
    else if (k >= '1' && k <= '4') setView(['week', 'day', 'agenda', 'shift'][+k - 1]);
  });

  window.addEventListener('adrial-theme', render);
  window.addEventListener('storage', function (e) { if (e.key === LS_KEY) { store = loadStore(); render(); } });

  render();
})();
</script>
</body>
</html>
