<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM · Adrial Apps</title>
<meta name="description" content="B2B sales CRM demo: companies, contacts, deal pipeline, activities and quotes.">
<script src="/_shared/adrial-shell.js" data-pos="br"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo" aria-hidden="true">C</span><b>CRM</b></div>
    <nav id="nav" aria-label="Sections">
      <a data-nav="home" href="#/">Home</a>
      <a data-nav="deals" href="#/deals">Deals <span class="cnt" data-count="deals"></span></a>
      <a data-nav="companies" href="#/companies">Companies <span class="cnt" data-count="companies"></span></a>
      <a data-nav="contacts" href="#/contacts">Contacts <span class="cnt" data-count="contacts"></span></a>
      <a data-nav="activities" href="#/activities">Activities <span class="cnt warn" data-count="activities"></span></a>
      <a data-nav="digest" href="#/digest">Weekly digest</a>
      <a data-nav="templates" href="#/templates">E-mail templates</a>
      <a data-nav="team" href="#/team">Team targets</a>
      <a data-nav="duplicates" href="#/duplicates">Duplicates <span class="cnt" data-count="duplicates"></span></a>
      <a data-nav="data" href="#/data">Data &amp; sync</a>
    </nav>
    <div id="syncSide"></div>
  </aside>
  <div class="col">
    <header class="top">
      <button class="btn ghost" id="searchBtn" type="button" aria-label="Search (press / or Ctrl+K)">Search <kbd>/</kbd></button>
      <label class="me">My view <select id="meSel" aria-label="My view"></select></label>
      <span class="grow"></span>
      <div class="newmenu">
        <button class="btn primary" id="newBtn" type="button" aria-haspopup="true">+ New</button>
        <div class="menu" id="newMenu" hidden>
          <button type="button" data-act="new-deal">Deal</button>
          <button type="button" data-act="new-company">Company</button>
          <button type="button" data-act="new-contact">Contact</button>
          <button type="button" data-act="new-activity">Activity</button>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1"><p class="loading">Loading CRM…</p></main>
  </div>
</div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/_shared/adrial-bus.js"></script>
<script src="/_shared/adrial-sync.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
