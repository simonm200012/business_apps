<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/_shared/adrial-shell.js" data-pos="br"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Marketing calendar — Adrial Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="side" id="side" aria-label="Marketing calendar navigation">
    <a class="brand" href="#/"><i aria-hidden="true"></i><span><b>Marketing calendar</b><small>Adrial · SI · HR · IT</small></span></a>
    <nav class="nav" aria-label="Sections">
      <a href="#/" data-nav="calendar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar<span class="cnt" id="navConflicts"></span></a>
      <a href="#/campaigns" data-nav="campaigns"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Campaigns<span class="cnt" id="navCampaigns"></span></a>
      <a href="#/content" data-nav="content"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Content planner<span class="cnt" id="navContent"></span></a>
      <a href="#/performance" data-nav="performance"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Performance</a>
      <a href="#/budget" data-nav="budget"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.6-1-1.7-1.5-3-1.5-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.4 0-2.6-.6-3.1-1.6M12 6v2M12 16v2"/></svg>Budget<span class="cnt" id="navBudget"></span></a>
      <a href="#/utm" data-nav="utm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>UTM builder</a>
    </nav>
    <div class="side-foot">
      <div id="modeSide" class="modebox" aria-live="polite"></div>
      <div id="syncSide" class="sync-side"></div>
      <span class="demo-pill" id="sidePill" title="All campaigns, people and numbers are fictional demo data. Nothing is ever posted, sent or published to any ad platform, social network, e-mail or SMS service."><i aria-hidden="true"></i>Demo data · nothing is ever posted, sent or published · saved in this browser, plus your private cloud copy when you sign in to sync</span>
      <button type="button" class="btn sm" data-act="reset" id="resetBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>Reset demo data</button>
    </div>
  </aside>
  <div class="side-scrim" id="sideScrim" hidden></div>
  <div class="maincol">
    <header class="top">
      <button type="button" class="btn icon menubtn" id="menuBtn" aria-label="Open navigation" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button type="button" class="searchbtn" data-act="search" aria-label="Find a campaign (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Find a campaign or post…</span><kbd>Ctrl K</kbd></button>
      <span class="grow"></span>
      <span id="modePill" class="modepill" role="status" hidden></span>
      <button type="button" class="btn pri newbtn" data-act="new-campaign" aria-label="New campaign"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New campaign</span></button>
    </header>
    <main id="main" tabindex="-1"><div class="page"><p class="loading" role="status">Loading marketing calendar…</p></div></main>
  </div>
</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/_shared/adrial-sync.js"></script>
<script src="data.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
