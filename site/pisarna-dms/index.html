<style>
:root {

/* Back bar in the document window (added for Adrial Apps) */
.dms-back { flex: none; display: flex; align-items: center; gap: 10px; padding: 4px 8px; background: var(--bar); border-bottom: 1px solid var(--line); }
.dms-back-btn { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font: inherit; }

.theme-modern .dms-back-btn { height: 34px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid var(--m-rule); background: var(--m-surface); color: var(--m-ink); font: 500 13px var(--m-font); box-shadow: var(--m-lift); }
.theme-modern .dms-back-btn:hover { background: var(--m-surface-2); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font: var(--fs)/1.25 var(--font); color: #000; background: var(--bar); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; user-select: none; }
.app input, .app textarea, .app .selectable { user-select: text; }


.menubar { display: flex; align-items: stretch; height: 22px; background: #fff; flex: none; position: relative; z-index: 30; }

.menubar .mi.disabled { color: #8d8d8d; }
.menubar .mi:hover:not(.disabled), .menubar .mi.open { background: var(--hover); border-color: var(--hover-line); }
.menubar .mi u { text-decoration: none; }

.menubar .brand { margin-left: auto; display: flex; align-items: center; padding-right: 6px; }
.wordmark { background: #0b3d91; color: #fff; font: italic 700 13px/16px var(--font); letter-spacing: .5px; padding: 0 10px; border-radius: 3px; }


.menu { position: fixed; z-index: 1000; background: #f2f2f2; border: 1px solid #ccc; box-shadow: 2px 3px 6px rgba(0,0,0,.25); padding: 2px; min-width: 160px; }
.menu .row { display: grid; grid-template-columns: 26px 1fr auto 18px; align-items: center; height: 22px; padding: 0 2px; white-space: nowrap; cursor: default; border: 1px solid transparent; }

.menu .row.default .lbl { font-weight: 600; }
.menu .sep { height: 1px; background: #d7d7d7; margin: 3px 2px 3px 28px; }

.modstrip { display: flex; height: 27px; background: var(--chrome); flex: none; align-items: flex-end; padding-left: 2px; }
.modtab { display: flex; align-items: center; gap: 4px; height: 25px; padding: 0 7px 0 4px; cursor: default; border: 1px solid transparent; border-bottom: 0; }

.modtab:hover:not(.active) { background: #cdd2d8; }
.toolbar { display: flex; align-items: center; height: 29px; background: var(--bar); border-bottom: 1px solid #b7b7b7; padding: 0 4px; flex: none; gap: 1px; }
.tb { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 5px; border: 1px solid transparent; border-radius: 2px; background: none; cursor: default; white-space: nowrap; }
.tb:hover:not(:disabled) { background: var(--hover); border-color: var(--hover-line); }
.tb:active:not(:disabled) { background: #cce8ff; }

.tsep { width: 1px; height: 20px; background: #c8c8c8; margin: 0 3px; }
.toolbar .spacer { flex: 1; }
.toolbar.icons-medium svg { width: 20px; height: 20px; }
.toolbar.icons-large svg { width: 24px; height: 24px; }
.toolbar.text-none .tb .tl { display: none; }
.toolbar.text-under .tb { flex-direction: column; height: auto; gap: 0; padding: 1px 5px; }
.toolbar.text-under { height: auto; min-height: 29px; }
select.win, input.win, textarea.win { height: 20px; border: 1px solid #a9a9a9; background: #fff; padding: 0 3px; border-radius: 0; outline: none; }
select.win:focus, input.win:focus, textarea.win:focus { border-color: #0078d7; }
input.win:disabled, select.win:disabled, textarea.win:disabled { background: #f0f0f0; color: #6d6d6d; }
textarea.win { height: auto; padding: 2px 3px; resize: vertical; }
.company-select { width: 120px; }


.body { flex: 1; display: flex; min-height: 0; }
.rail { width: 60px; background: var(--chrome); flex: none; display: flex; flex-direction: column; align-items: stretch; padding-top: 6px; }
.rail .it { display: flex; flex-direction: column; align-items: center; padding: 3px 0 4px; cursor: default; font-size: 11.5px; color: #111; border: 1px solid transparent; margin: 0 2px; }

.pane { width: 170px; background: var(--pane); flex: none; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #b9bfc6; position: relative; }

.content { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; position: relative; }

.tree { flex: 1; overflow: auto; padding: 6px 0 4px; }

.tree .node .ficon { margin: 0 4px 0 2px; flex: none; }

.badge { background: var(--badge); color: #fff; border-radius: 9px; font-size: 11px; line-height: 15px; min-width: 18px; padding: 0 5px; text-align: center; flex: none; }

.pane-foot { padding: 3px 3px 4px; border-top: 1px solid #c9cfd6; }
.pane-foot select { width: 100%; }


.gridwrap { flex: 1; min-height: 0; overflow: auto; position: relative; background: #fff; outline: none; }
table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max-content; }

.ftri { float: right; font-size: 9px; color: #000; padding: 0 2px; cursor: default; line-height: 19px; }

.grid-empty { padding: 8px; color: #777; }
.limited { position: absolute; right: 8px; bottom: 6px; z-index: 6; background: #ffffe1; border: 1px solid #c8c8a0; box-shadow: 1px 2px 4px rgba(0,0,0,.2); padding: 6px 26px 6px 8px; max-width: 420px; font-size: 11.5px; }

.gridicons span { cursor: default; display: flex; }


.vfilter { position: fixed; z-index: 1001; background: #fff; border: 1px solid #a0a0a0; box-shadow: 2px 3px 6px rgba(0,0,0,.25); min-width: 150px; max-width: 260px; }
.vfilter .vals { max-height: 260px; overflow: auto; padding: 3px 4px; }
.vfilter label { display: flex; gap: 5px; align-items: center; height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.overlay { position: fixed; inset: 0; z-index: 900; background: rgba(0,0,0,.04); display: flex; align-items: center; justify-content: center; }
.overlay.dim { background: rgba(0,0,0,.35); }
.dlg { background: #f0f0f0; border: 1px solid #8a8a8a; box-shadow: 0 8px 28px rgba(0,0,0,.35); display: flex; flex-direction: column; max-width: 96vw; max-height: 94vh; border-radius: 7px; overflow: hidden; }
.dlg .tbar { height: 31px; background: #fff; display: flex; align-items: center; padding-left: 8px; gap: 6px; flex: none; }
.dlg .tbar .t { flex: 1; font-size: 12px; }
.dlg .tbar .b { width: 44px; height: 31px; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: default; }
.dlg .tbar .b:hover { background: #e5e5e5; }
.dlg .tbar .b.x:hover { background: #e81123; color: #fff; }
.dlg .dbody { flex: 1; overflow: auto; padding: 10px; min-height: 0; }
.dlg .dfoot { display: flex; gap: 8px; padding: 9px 12px; justify-content: flex-end; flex: none; align-items: center; }

.btn { min-width: 72px; height: 24px; padding: 0 10px; background: #fdfdfd; border: 1px solid #c4c4c4; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; cursor: default; }
.btn:hover:not(:disabled) { background: #f4f9fd; border-color: #0078d7; }
.btn.primary { border-color: #0078d7; box-shadow: inset 0 0 0 1px #0078d7; }
.btn:disabled { color: #9a9a9a; }
.btn:disabled svg { opacity: .45; filter: grayscale(1); }
.form { display: grid; grid-template-columns: max-content 1fr; gap: 5px 8px; align-items: center; }
.form label.r { text-align: right; }
.fieldset { border: 1px solid #d8d8d8; padding: 6px 8px 8px; margin: 0 0 8px; }

.msg { display: flex; gap: 12px; align-items: flex-start; padding: 6px 4px; max-width: 520px; white-space: pre-wrap; }
.demo-note { color: #6b6b6b; font-size: 11px; }

.catdlg { display: flex; height: 100%; }
.catdlg .cats { width: 78px; background: var(--chrome); display: flex; flex-direction: column; align-items: stretch; padding-top: 4px; flex: none; }
.catdlg .cats .it { display: flex; flex-direction: column; align-items: center; padding: 6px 0 5px; cursor: default; font-size: 11.5px; text-align: center; }

.catdlg .panel { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #f0f0f0; }

.cbx3 { width: 13px; height: 13px; border: 1px solid #333; display: inline-flex; align-items: center; justify-content: center; background: #fff; vertical-align: -2px; border-radius: 2px; flex: none; }

.chk { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
.graybar { background: #a5a5a5; display: flex; gap: 2px; align-items: center; padding: 2px 4px; }

.whitebox { background: #fff; border: 1px solid #a9a9a9; }


table.plain { border-collapse: collapse; width: 100%; table-layout: fixed; }
table.plain th { background: #fff; text-align: left; font-weight: 400; border-right: 1px solid #e3e3e3; border-bottom: 1px solid #e3e3e3; padding: 2px 4px; height: 22px; }

.crit { flex: 1; overflow-y: auto; overflow-x: hidden; }

.findbar { display: flex; align-items: center; gap: 6px; padding: 4px 6px; flex: none; }

.docwin { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bar); z-index: 50; }

.thumb { background: #fff; border: 1px solid #c9c9c9; padding: 3px; margin-bottom: 2px; cursor: default; }

.center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.vtabs { display: flex; gap: 2px; height: 22px; align-items: flex-end; background: var(--bar); padding-left: 6px; flex: none; }
.vtabs .t { display: flex; gap: 4px; align-items: center; height: 20px; padding: 0 8px; border: 1px solid transparent; border-bottom: 0; cursor: default; }
.vtabs .t.active { background: #fff; border-color: #c8c8c8; }
.canvas { flex: 1; overflow: auto; background: var(--canvas); position: relative; }

    --m-bad: #f07f7f; --m-bad-soft: rgba(240, 127, 127, .13); --m-info: #8fb2ff; --m-info-soft: rgba(143, 178, 255, .13);

  --m-ground: #070708; --m-surface: #101012; --m-surface-2: #17171a; --m-surface-3: #202024;
  --m-ink: #f3f2ef; --m-ink-2: #a9a8a4; --m-ink-3: #8b8a85; --m-accent: #9b86ff; --m-accent-soft: rgba(155, 134, 255, .14); --m-accent-ink: #0c0c0d;
  --m-rule: rgba(243, 242, 239, .1); --m-rule-soft: rgba(243, 242, 239, .05); --m-scrim: rgba(4, 4, 5, .72);
  --m-lift: 0 0 0 1px rgba(243, 242, 239, .06); --m-dialog: 0 50px 120px -40px rgba(0, 0, 0, .8), 0 0 0 1px rgba(243, 242, 239, .08);
  --m-page: 0 30px 60px -30px rgba(0, 0, 0, .8); --m-canvas: #17171a;
  --m-ok: #52c98a; --m-ok-soft: rgba(82, 201, 138, .14); --m-warn: #e7b04c; --m-warn-soft: rgba(231, 176, 76, .14);
