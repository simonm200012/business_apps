<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/_shared/stratum-shell.js" data-home="1" data-pos="br"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Not found — Business Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F4;--ink:#26251E;--ink2:rgba(38,37,30,.62);--ink3:rgba(38,37,30,.42);--btn:#26251E;--btnInk:#F7F7F4;--btnHover:#3B3A33;--accent:#F54E00;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120B;--ink:#EDECEC;--ink2:rgba(237,236,236,.62);--ink3:rgba(237,236,236,.42);--btn:#EDECEC;--btnInk:#14120B;--btnHover:#D7D6D5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120B;--ink:#EDECEC;--ink2:rgba(237,236,236,.62);--ink3:rgba(237,236,236,.42);--btn:#EDECEC;--btnInk:#14120B;--btnHover:#D7D6D5;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif;padding:24px 16px 96px;box-sizing:border-box;-webkit-font-smoothing:antialiased}
main{max-width:520px}
.mono{font:400 12px 'Geist Mono',ui-monospace,monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
h1{margin:12px 0 10px;font-size:clamp(30px,6vw,44px);line-height:1.12;font-weight:400;letter-spacing:-.025em}
p{margin:0 0 24px;color:var(--ink2);font-size:16px}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:var(--btn);color:var(--btnInk);text-decoration:none;transition:background .14s}
a.btn:hover{background:var(--btnHover)}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

</head>
<body>
<main>
  <span class="mono">404 · Not found</span>
  <h1>This page is not here.</h1>
  <p>The address may be mistyped, or the app has moved. Every app is on the home page.</p>
  <a class="btn" href="/">Go to Business Apps →</a>
</main>
</body>
</html>
