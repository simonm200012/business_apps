<body>
<div class="app" id="app">
  <header class="bar">
    <a class="btn sub" id="back" href="/">← Back</a>
    <h1 class="ttl" id="ttl">Pitch</h1>
    <button type="button" class="btn sub" id="fs" aria-label="Full screen" title="Full screen (F)">Full screen</button>
  </header>
  <main class="wrap" id="wrap">
    <div class="frame" id="frame"><div class="stage" id="stage" role="region" aria-label="Animated pitch" aria-live="off"></div></div>
  </main>
  <footer class="ctl">
    <div class="prog" id="prog" aria-hidden="true"><i id="progFill"></i></div>
    <div class="row">
      <button type="button" class="btn" id="prev" aria-label="Previous scene" hidden>Previous</button>
      <button type="button" class="btn pri" id="pp" aria-label="Pause" title="Play / pause (Space)">Pause</button>
      <button type="button" class="btn" id="next" aria-label="Next scene" hidden>Next</button>
      <button type="button" class="btn" id="rs" title="Restart (R)">Restart</button>
      <div class="dots" id="dots" role="group" aria-label="Scenes"></div>
      <span class="clock" id="clock" aria-hidden="true"></span>
    </div>
  </footer>
</div>
