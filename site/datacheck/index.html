<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/_shared/stratum-shell.js" data-pos="br"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Data health check — Business Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="gx.css?v=6">
<!-- phone app: tools/make-pwa.mjs --><link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg"><link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Business Apps"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="stylesheet" href="/_shared/phone.css"><!-- /phone app -->
</head>
<body>
<a class="skip" href="#main" id="skipLink">Skip to content</a>
<div class="app">
  <aside class="side" id="side" aria-label="Data health check navigation">
    <div class="brand">
      <a href="#/"><i aria-hidden="true"></i><span><span id="brandName">Data health check</span><small id="brandSub">Files stay in this browser</small></span></a>
      <button type="button" class="btn sm menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span id="menuLabel">Menu</span>
      </button>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <span class="demo-pill" id="demoPill" title="The three demo files are fictional exports with planted problems. Files you check are read in this browser and never uploaded; with cloud sync on, only settings and the list of checks with their scores travel."><i aria-hidden="true"></i><span id="demoPillText">Demo data · saved in this browser only</span></span>
      <label class="lang-pick"><span id="langLabel">Language</span><select id="uiLang"><option value="en">English</option><option value="sl">Slovenščina</option><option value="hr">Hrvatski</option></select></label>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"><div class="page"><p class="loading" role="status"><i aria-hidden="true"></i><span id="bootText">Opening the data health check…</span></p></div></main>
</div>
<div id="layers"></div>
<div class="busy" id="busy" hidden><div class="busy-in"><span id="busyLabel">Working</span><b id="busyPct">0 %</b></div><div class="busy-bar" id="busyTrack" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="busyBar"></i></div></div>
<div class="dropzone" id="dropzone" hidden aria-hidden="true"><div id="dropText">Drop the file to check it</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filePick" accept=".csv,.tsv,.txt,.tab,.xlsx,.xlsm,.xls,.ods,text/csv,text/plain,text/tab-separated-values" hidden>
<script src="/_shared/stratum-sync.js"></script>
<script src="postal-data.js?v=1"></script>
<script src="engine.js?v=3"></script>
<script src="i18n.js?v=1"></script>
<script src="data.js?v=3"></script>
<script src="app.js?v=4"></script>
</body>
</html>
