<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/_shared/adrial-shell.js" data-pos="br"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM — Adrial Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main" id="skipLink">Skip to content</a>
<div class="app">
  <aside class="side" id="side" aria-label="CRM navigation">
    <a class="brand" href="#/"><b>CRM<span>.</span></b><small>Adrial B2B</small></a>
    <nav class="nav" aria-label="Sections">
      <a href="#/" data-nav="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Home</a>
      <a href="#/deals" data-nav="deals"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Deals<span class="cnt" id="navDeals"></span></a>
      <a href="#/companies" data-nav="companies"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/></svg>Companies<span class="cnt" id="navCompanies"></span></a>
      <a href="#/contacts" data-nav="contacts"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c1.9.7 3.1 2.5 3.5 5.4"/></svg>Contacts<span class="cnt" id="navContacts"></span></a>
      <a href="#/activities" data-nav="activities"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15l2 2 4-4"/></svg>Activities<span class="cnt" id="navActivities"></span></a>
      <span class="label nav-label">Tools</span>
      <a href="#/digest" data-nav="digest"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg>Weekly digest</a>
      <a href="#/templates" data-nav="templates"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Email templates</a>
      <a href="#/data" data-nav="data"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Import &amp; export</a>
      <a href="#/team" data-nav="team"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Sales team</a>
      <a href="#/duplicates" data-nav="duplicates"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Duplicates<span class="cnt" id="navDups"></span></a>
    </nav>
    <div class="side-foot">
      <div id="syncSide" class="sync-side"></div>
      <span class="demo-pill" title="All companies, people and numbers are fictional demo data. Your changes are saved in this browser, plus a private cloud copy when you sign in to sync."><i></i>Demo data · saved in this browser, plus your private cloud copy when you sign in to sync</span>
      <button type="button" class="btn sm" data-act="reset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>Reset demo data</button>
    </div>
  </aside>
  <div class="side-scrim" id="sideScrim" hidden></div>
  <div class="maincol">
    <header class="top">
      <button type="button" class="btn icon menubtn" id="menuBtn" aria-label="Open navigation" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button type="button" class="searchbtn" id="searchBtn" data-act="search" aria-label="Search companies, contacts and deals (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search companies, contacts, deals…</span><kbd>Ctrl K</kbd></button>
      <span class="grow"></span>
      <div class="meview">
        <label class="label" for="meSel">My view</label>
        <select class="select" id="meSel" data-chg="me"></select>
      </div>
      <button type="button" class="btn pri newbtn" id="newBtn" data-act="new-menu" aria-haspopup="menu" aria-expanded="false" aria-label="Create new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
    </header>
    <main id="main" tabindex="-1"><div class="page"><p class="loading" role="status">Loading CRM…</p></div></main>
  </div>
</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/_shared/adrial-bus.js"></script>
<script src="/_shared/adrial-sync.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
