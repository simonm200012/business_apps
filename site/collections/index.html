<body>
<a class="skip" href="#main" id="skipLink">Skip to content</a>
<div class="app">
  <aside class="side" id="side" aria-label="Collections navigation">
    <div class="brand">
      <a href="#/"><i aria-hidden="true"></i><span>Collections<small id="brandSub">Demo · receivables</small></span></a>
      <button type="button" class="btn sm menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span id="menuLabel">Menu</span>
      </button>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <span class="demo-pill" id="demoPill" title="The company, customers, people, invoices, phone numbers and amounts are fictional demo data. Letters are never sent by the app: you print them or open them in your own mail app. Your changes and imports stay in this browser."><i aria-hidden="true"></i><span id="demoText">Demo data · saved in this browser only</span></span>
      <div class="ws-box" id="wsBox" hidden></div>
      <label class="lang-pick"><span id="langLabel">Language</span><select id="uiLang"><option value="en">English</option><option value="sl">Slovenščina</option><option value="hr">Hrvatski</option></select></label>
      <a class="btn sm" href="#/settings" id="settingsLink">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>Letterhead &amp; settings
      </a>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"><div class="page"><p class="loading" role="status"><i aria-hidden="true"></i>Loading receivables…</p></div></main>
</div>
<div id="printArea"></div>
<div id="layers"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>
<input type="file" id="csvPick" accept=".csv,text/csv,text/plain,.txt" hidden>
<input type="file" id="bankPick" accept=".xml,.csv,.txt,text/xml,application/xml,text/csv,text/plain" hidden>

<script src="ws-sync.js?v=3"></script>
<script src="app.js?v=9"></script>
