<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/_shared/adrial-shell.js" data-pos="br"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cash forecast — Adrial Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="side" id="side" aria-label="Cash forecast navigation">
    <div class="brand">
      <a href="#/"><i aria-hidden="true"></i><span>Cash forecast<small id="brandSub">Demo · 13 weeks</small></span></a>
      <button type="button" class="btn sm menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu
      </button>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <span class="demo-pill" title="The company, customers, suppliers, invoices and amounts are fictional demo data. Nothing is ever sent anywhere; your changes and imports stay in this browser."><i aria-hidden="true"></i>Demo data · saved in this browser only</span>
      <a class="btn sm" href="#/settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>Balances &amp; settings
      </a>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"><div class="page"><p class="loading" role="status"><i aria-hidden="true"></i>Building the forecast…</p></div></main>
</div>
<div id="layers"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="csvPick" accept=".csv,text/csv,text/plain" hidden>
<script src="engine.js?v=2"></script>
<script src="data.js?v=2"></script>
<script src="app.js?v=2"></script>

</html>
